name: Windows UTF-8 regression

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell syntax and behavior
        shell: pwsh
        run: ./tests/run-tests.ps1
      - name: Run read-only health check (PowerShell 7)
        shell: pwsh
        run: ./scripts/health-check.ps1 -Json
      - name: Run read-only health check (Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/health-check.ps1 -Json
